<!DOCTYPE html>
<html lang="pt-br">
<head>

  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-basic-min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/abcjs-audio.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }
    h1, h2 {
      text-align: center;
      color: #333;
    }
    #audio, #paper {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #audio {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <script>
    var abcNotation = `

    var visualObj = ABCJS.renderAbc("paper", abcNotation, { responsive: "resize" })[0];

    if (ABCJS.synth.supportsAudio()) {
      var synthControl = new ABCJS.synth.SynthController();
      synthControl.load("#audio", null, {
        displayRestart: true,
        displayPlay: true,
        displayProgress: true,
        displayWarp: true
      });

      var createSynth = new ABCJS.synth.CreateSynth();
      createSynth.init({
        visualObj: visualObj,
        options: { chordsOff: true }
      }).then(function () {
        synthControl.setTune(visualObj, false);

</body>
</html>
