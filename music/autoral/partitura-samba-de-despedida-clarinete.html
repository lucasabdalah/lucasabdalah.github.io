<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Partitura - Clarinete</title>
  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-basic-min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
    }
    #papel {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div id="papel"></div>

  <script>
    const partitura = `
X:1
T:Samba de Despedida - Partitura para Bb
M:4/4
L:1/4
K:E
"^[Intro]" |
"^[Verso I]" |
"^[Verso II]" |
"^[Refrão]" |
"^[Fim - Intro que termina em Em]" |
    `;

    ABCJS.renderAbc("papel", partitura, { responsive: "resize" });
  </script>
</body>
</html>
