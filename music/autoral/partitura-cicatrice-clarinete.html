<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Partitura - Clarinete</title>
  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-basic-min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
    }
    #papel {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div id="papel"></div>

  <script>
    const partitura = `
X:1
T:Clarinete - Cicatrice
M:4/4
L:1/4
K:G#m
"^[Intro]" G#4 |
G# A B G# | c#4 |
c# c c# d | d#4 |
"^[Passagem]"f# g# f# e | d# e d# c# | B c# B A# |
"^[Verso]" G# A B G# | c#4 |
G# G F#2 | F# F E2 |
B c c# d | d#4 |
G# G F#2 |
B c c#2 |
c# d d#2 |
"^[Pre do Refrão]" A# B c2 |
"^[Refrão]" B B B B A# G# G# d#4 |
"^[Passagem]"f# g# f# e | d#4 e d#4 c# | B c# B A# |
"^[Solo 1 - Verso]"|
"^[Passagem]"|
"^[Verso]"|
"^[Pre do Refrão]"|
"^[Refrão]"|
"^[Pre do Refrão]"|
"^[Solo 2 - Solo]"|
"^[Pre do Refrão]"|
"^[Refrão]"|
"^[Fim]" c# c c# d | d#4 | 
d#4 c# B A# G#  |

    `;

    ABCJS.renderAbc("papel", partitura, { responsive: "resize" });
  </script>
</body>
</html>
