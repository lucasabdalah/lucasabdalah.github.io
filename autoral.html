<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repertorio - Que Banda É Essa?</title>
  <style>
    body {
      font-size: 18px;
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #bae1ff;
      color: rgb(192, 17, 17);
      padding: 15px;
      text-align: center;
    }

    h1,
    h2 {
      font-size: 24px;
      margin-bottom: 15px;
    }

    a {
      color: #0066cc;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      background-color: #4caf50;
      color: white;
      padding: 10px 15px;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 20px;
    }

    th,
    td {
      border: 1px solid #dddddd;
      text-align: left;
      padding: 12px;
    }

    tr:nth-child(3n) td {
      border-bottom: 3px solid #333333;
    }

    th {
      background-color: #f2f2f2;
    }

    .container {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
    }

    .column {
      flex: 1;
      padding: 10px;
    }
  </style>
  <script>
    var linkList = [
      "cicatrice",
      "samba-de-despedida",
      "cartomante",
      "partitura-cicatrice-clarinete",
      "partitura-samba-de-despedida-clarinete",
      "partitura-cartomante-clarinete",
      "partitura-cicatrice-flauta",
      "partitura-samba-de-despedida-flauta",
      "partitura-cartomante-sax"
    ];

    var commonPath = "https://lucasabdalah.github.io/music/autoral/";

    function populateOptions() {
      var datalist = document.getElementById("linkList");
      if (!datalist) return;

      linkList.forEach(function (title) {
        var link = commonPath + title + ".html";
        var option = document.createElement("option");
        option.value = link;
        option.text = title.replace(/-/g, ' ');
        datalist.appendChild(option);
      });
    }

    function showTable() {
      var tableContainer = document.getElementById("tableContainer");
      var table = document.createElement("table");
      var tbody = document.createElement("tbody");

      for (var i = 0; i < linkList.length; i++) {
        var link = linkList[i];
        var title = link.replace(/-/g, " ");
        title = title.charAt(0).toUpperCase() + title.slice(1);

        var row = document.createElement("tr");
        var cell = document.createElement("td");
        var linkElement = document.createElement("a");

        var targetLink = commonPath + link + ".html";
        linkElement.href = targetLink;
        linkElement.target = "_blank";
        linkElement.textContent = title;

        (function (targetLink) {
          linkElement.addEventListener("click", function () {
            var container = document.getElementById("container");
            container.style.display = "block";
            container.src = targetLink;
          });
        })(targetLink);

        cell.appendChild(linkElement);
        row.appendChild(cell);
        tbody.appendChild(row);
      }

      table.appendChild(tbody);
      tableContainer.appendChild(table);
    }
  </script>
</head>

<body onload="populateOptions()">
  <header>
    <h1>Repertorio</h1>
  </header>
  <div class="container" id="container">
    <div class="column narrow-column">
      <div id="tableContainer">Lista de Musicas</div>
    </div>
  </div>

  <script>
    showTable();
  </script>
</body>

</html>
